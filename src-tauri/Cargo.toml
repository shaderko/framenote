[package]
name = "framenote"
version = "0.1.0"
description = "Local-first video notes with Markdown sidecars"
authors = ["FrameNote contributors"]
edition = "2021"

[lib]
name = "framenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
base64 = "0.22"
keyring = "4.1.5"
mdns-sd = "0.20.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = [] }
tempfile = "3.20"
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "process", "time"] }
tokio-util = "0.7"
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
